version: "3.9"

services:
  vistula-sentinel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: vistula-sentinel-service
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"