version: '3.8'

services:
  boreas-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boreas-notifier-agent
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=Boreas1111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_SENDER_EMAIL=settlement@boreas.finance
      - ENTERPRISE_ALERT_EMAIL=treasury@superteam.poland
      - OPS_DISCORD_WEBHOOK_URL=${OPS_DISCORD_WEBHOOK_URL}
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"