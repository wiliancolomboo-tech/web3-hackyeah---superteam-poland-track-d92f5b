version: "3.8"

services:
  bursztyn-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bursztyn-enterprise-worker
    restart: always
    environment:
      - NODE_ENV=production
      - PROGRAM_ID=BursZtyn1111111111111111111111111111111111
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ENTERPRISE_AUDIT_EMAIL=treasury@superteam.fun
      - PORT=8080
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"