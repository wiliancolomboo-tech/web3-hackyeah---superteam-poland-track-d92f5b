version: "3.8"

services:
  solvanguard-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solvanguard-sentinel-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_HTTP=https://api.devnet.solana.com
      - SOLANA_RPC_WS=wss://api.devnet.solana.com
      - PROGRAM_ID=Vangurd11111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL}
      - AUDIT_EMAIL_RECIPIENT=hackyeah-judges@superteam.fun
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"