version: '3.8'

services:
  aura-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_enterprise_agent
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - AURA_PROGRAM_ID=AuRA111111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - TREASURY_EMAIL=${TREASURY_EMAIL}
      - PORT=8080
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"