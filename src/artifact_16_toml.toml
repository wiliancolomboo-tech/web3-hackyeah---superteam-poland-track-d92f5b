[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.17"

[features]
seeds = true
skip-lint = false

[programs.devnet]
kreska_protocol = "Kreska1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
start-daemon = "ts-node daemon/src/index.ts"