version: '3.8'

services:
  sentinel:
    build:
      context: ./daemon
      dockerfile: Dockerfile
    container_name: ambershield-sentinel
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_ENDPOINT=https://api.devnet.solana.com
      - SOLANA_WS_ENDPOINT=wss://api.devnet.solana.com
      - PROGRAM_ID=AmbSH1eLd1111111111111111111111111111111111
      - CRANK_KEYPAIR_BASE58=${CRANK_KEYPAIR_BASE58}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - NOTIFICATION_TARGET_EMAIL=lead-architect@superteam.pl
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3