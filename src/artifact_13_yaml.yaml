version: "3.8"

services:
  hedgepay-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hedgepay-relayer-daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=Hedge11111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDER_EMAIL=settlement@hedgepay.eu
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL}
      - HEALTH_PORT=8080
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"